name: MEMECYCLE CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  app:
    name: Application tests and production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Install dependencies
        run: npm install
      - name: Run test suite
        run: npm test
      - name: Build application
        run: npm run build

  edge-functions:
    name: Edge function type checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check monitor function
        run: deno check supabase/functions/memecycle-monitor/index.ts
      - name: Check revival function
        run: deno check supabase/functions/memecycle-revival/index.ts
