name: MEMECYCLE CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  app:
    name: Application tests and production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Install dependencies
        run: npm install
      - name: Report dependency vulnerabilities
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node -e "const a=require('/tmp/npm-audit.json'); for (const [name,v] of Object.entries(a.vulnerabilities || {})) console.log(JSON.stringify({name,severity:v.severity,isDirect:v.isDirect,range:v.range,via:(v.via || []).map(x => typeof x === 'string' ? x : x.title),fixAvailable:v.fixAvailable}));"
      - name: Run test suite
        run: npm test
      - name: Build application
        run: npm run build

  edge-functions:
    name: Edge function type checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install project dependencies
        run: npm install
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check discovery worker
        run: deno check --node-modules-dir=auto --import-map=supabase/functions/memecycle-worker/deno.json supabase/functions/memecycle-worker/index.ts
      - name: Check monitor function
        run: deno check --node-modules-dir=auto supabase/functions/memecycle-monitor/index.ts
      - name: Check revival function
        run: deno check --node-modules-dir=auto supabase/functions/memecycle-revival/index.ts
      - name: Check wallet recovery function
        run: deno check --node-modules-dir=auto supabase/functions/memecycle-wallet-recovery/index.ts
      - name: Test revival queue policy
        run: deno test --node-modules-dir=auto supabase/functions/memecycle-revival/queue-policy.deno.ts
