name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install Node dependencies
        run: npm install --no-audit --no-fund

      - name: Run Node tests
        run: npm test

      - name: Build web application
        run: npm run build

      - name: Type-check Supabase Edge Functions
        run: deno check --no-lock supabase/functions/memecycle-monitor/index.ts supabase/functions/memecycle-revival/index.ts
